name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: alwayslose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          build-root-directory: alwayslose
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: alwayslose
          path: alwayslose/build/libs/
