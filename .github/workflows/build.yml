name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i aç
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Derle
        working-directory: alwayslose
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: alwayslose
          path: alwayslose/build/libs/
